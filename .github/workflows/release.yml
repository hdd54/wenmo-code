name: 打包发布问墨·code

# 触发方式：
#   1. 推送 tag（v*.*.*）→ 自动打包 + 发布 GitHub Release（推荐）
#   2. 手动触发（workflow_dispatch）→ 可指定版本号，覆盖同名 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.7，留空则读 updater.py）'
        required: false
        default: ''
      publish:
        description: '通过手动运行创建/覆盖 GitHub Release（默认仅构建验证）'
        required: false
        type: boolean
        default: false

concurrency:
  group: wenmo-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 允许创建 Release / 上传资产
  id-token: write   # GitHub OIDC / Sigstore provenance
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ---------- 1. 检出代码 ----------
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查受版本控制文件中的凭据
        shell: pwsh
        run: python scripts/check_release_secrets.py

      - name: 校验代码签名密钥并固定发布者证书
        shell: pwsh
        env:
          WENMO_SIGNING_PFX: ${{ secrets.WENMO_SIGNING_PFX }}
          WENMO_SIGNING_PASSWORD: ${{ secrets.WENMO_SIGNING_PASSWORD }}
        run: |
          if (-not $env:WENMO_SIGNING_PFX) { throw "缺少 WENMO_SIGNING_PFX（base64 PFX），发布必须签名" }
          if (-not $env:WENMO_SIGNING_PASSWORD) { throw "缺少 WENMO_SIGNING_PASSWORD，发布必须签名" }
          $bytes = [Convert]::FromBase64String($env:WENMO_SIGNING_PFX)
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $bytes, $env:WENMO_SIGNING_PASSWORD, $flags)
          if (-not $cert.Thumbprint -or -not $cert.Subject) { throw "无法读取代码签名证书身份" }
          @{ subject = $cert.Subject; thumbprint = $cert.Thumbprint } |
            ConvertTo-Json | Set-Content -LiteralPath "signing_policy.json" -Encoding utf8

      - name: 校验并确定发布版本
        id: version
        shell: pwsh
        run: |
          $updater = Get-Content updater.py -Raw
          $installer = Get-Content wenmo_installer.iss -Raw
          $appVersion = [regex]::Match($updater, 'APP_VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          $installerVersion = [regex]::Match($installer, 'MyAppVersion\s+"([^"]+)"').Groups[1].Value
          if (-not $appVersion) { throw "updater.py 缺少 APP_VERSION" }
          if ($installerVersion -ne $appVersion) { throw "版本不一致: updater=$appVersion installer=$installerVersion" }
          $requested = "${{ github.event.inputs.version }}".Trim().TrimStart('v')
          if ($requested -and $requested -ne $appVersion) { throw "手动版本 $requested 与源码版本 $appVersion 不一致" }
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}".TrimStart('v')
            if ($tagVersion -ne $appVersion) { throw "Tag $tagVersion 与源码版本 $appVersion 不一致" }
          }
          "version=$appVersion" >> $env:GITHUB_OUTPUT
          "tag=v$appVersion" >> $env:GITHUB_OUTPUT

      # ---------- 2. 安装 Python 3.12 ----------
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------- 3. 安装打包依赖 ----------
      # 与 build_wenmo.py 的 --hidden-import / --collect-* 对应
      - name: 安装打包依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller ruff

      - name: 发布前回归测试
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python tests/run_browser_qa.py
          node --check gui/static/app.js
          node --check gui/static/permissions_ui.js
          node --check gui/static/pricing_ui.js
          node --check gui/static/billing_ui.js
          node --check gui/static/update_ui.js
          node --check gui/static/auth_ui.js
          node --check gui/static/virtual_history.js
          python -m py_compile gui_server.py history.py auth.py pricing.py pricing_sync.py updater.py mcp_client.py plugins_loader.py permission_engine.py sandbox_runner.py tenant_state.py memory_graph.py agent_bridge.py usage_accounting.py conversation_workspace.py task_workspace.py execution_context.py worker.py plugins/orchestrate.py plugins/terminal.py plugins/vision.py billing_api.py billing_service.py billing_reconciliation.py secret_store.py
          ruff check --select F823 gui_server.py updater.py
          python -c "import gui_server; assert any(getattr(r, 'path', '') == '/api/health' for r in gui_server.app.routes)"

      - name: 获取上一版本清单用于增量包
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force previous-release | Out-Null
          gh release download --pattern manifest.json --dir previous-release 2>$null
          if (Test-Path previous-release\manifest.json) {
            Copy-Item previous-release\manifest.json prev_manifest.json -Force
          } else {
            Write-Host "没有上一版本 manifest，本次仅生成全量更新包"
          }

      # ---------- 4. 生成问墨.ico（若不存在）----------
      # 仓库里可能没有 .ico（它是 logo.png 转出的构建产物）
      - name: 生成问墨.ico
        shell: pwsh
        run: |
          if (-not (Test-Path "问墨.ico")) {
            python -c "from PIL import Image; img=Image.open('gui/static/logo.png'); img.save('问墨.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
            Write-Host "已生成 问墨.ico"
          } else {
            Write-Host "问墨.ico 已存在"
          }

      # ---------- 5. 运行 PyInstaller 打包 ----------
      # build_wenmo.py 里 VENV_PY 指向本机专用路径（CI 不存在 → 自动回退 sys.executable = CI 的 python）
      - name: PyInstaller 打包
        shell: pwsh
        run: |
          # CI 环境没有本机 venv，强制用当前 python
          $env:WENMO_VENV_PY = ""
          python build_wenmo.py
          if ($LASTEXITCODE -ne 0) { throw "build_wenmo.py 失败" }
          python scripts/check_release_secrets.py --path "dist\问墨"
          if ($LASTEXITCODE -ne 0) { throw "客户端产物包含疑似密钥" }
          $policy = Get-ChildItem "dist\问墨" -Recurse -Filter signing_policy.json | Select-Object -First 1
          if (-not $policy) { throw "打包产物缺少发布者证书固定策略" }
          $policyData = Get-Content $policy.FullName -Raw | ConvertFrom-Json
          if (-not $policyData.thumbprint) { throw "打包产物的发布者证书指纹为空" }
          Get-ChildItem dist -Name

      - name: Authenticode 签名应用主程序
        shell: pwsh
        env:
          WENMO_SIGNING_PFX: ${{ secrets.WENMO_SIGNING_PFX }}
          WENMO_SIGNING_PASSWORD: ${{ secrets.WENMO_SIGNING_PASSWORD }}
          WENMO_TIMESTAMP_URL: ${{ secrets.WENMO_TIMESTAMP_URL }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "wenmo-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WENMO_SIGNING_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "未找到 signtool.exe" }
          $timestamp = if ($env:WENMO_TIMESTAMP_URL) { $env:WENMO_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WENMO_SIGNING_PASSWORD /tr $timestamp /td SHA256 "dist\问墨\问墨.exe"
          if ($LASTEXITCODE -ne 0) { throw "主程序 Authenticode 签名失败" }
          & $signtool.FullName verify /pa /v "dist\问墨\问墨.exe"
          if ($LASTEXITCODE -ne 0) { throw "主程序 Authenticode 验证失败" }

      - name: 用已签名主程序重建更新包
        shell: pwsh
        run: |
          $previous = "previous-release\manifest.json"
          if (Test-Path $previous) {
            python build_wenmo.py --refresh-update-artifacts --previous-manifest $previous
          } else {
            python build_wenmo.py --refresh-update-artifacts
          }
          $verifyDir = Join-Path $env:RUNNER_TEMP "verify-signed-update"
          Expand-Archive -LiteralPath "dist\update.zip" -DestinationPath $verifyDir -Force
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa /v (Join-Path $verifyDir "问墨.exe")
          if ($LASTEXITCODE -ne 0) { throw "update.zip 内主程序未保留有效 Authenticode 签名" }

      # ---------- 6. 安装 Inno Setup ----------
      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "未找到 ISCC.exe" }
          Write-Host "ISCC: $($iscc.FullName)"
          # 中文语言文件（仓库已带 ChineseSimplified.isl，在项目根目录）

      # ---------- 7. 编译安装包 ----------
      - name: ISCC 编译安装包
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1
          & $iscc.FullName wenmo_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败" }
          Get-ChildItem dist -Name | Where-Object { $_ -like "*installer*" }

      # ---------- 8. 准备发布资产 ----------
      # 把安装包改名为 install.exe（updater.py 按名字匹配 install/setup）
      # 收集：install.exe + manifest.json + update.zip + delta-*.zip
      - name: 准备发布资产
        shell: pwsh
        run: |
          # 安装包改名 install.exe
          $setup = Get-ChildItem "dist\*_installer.exe" | Select-Object -First 1
          if (-not $setup) { throw "未生成安装包" }
          Copy-Item $setup.FullName "dist\install.exe" -Force
          $pfx = Join-Path $env:RUNNER_TEMP "wenmo-signing.pfx"
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $timestamp = if ($env:WENMO_TIMESTAMP_URL) { $env:WENMO_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WENMO_SIGNING_PASSWORD /tr $timestamp /td SHA256 "dist\install.exe"
          if ($LASTEXITCODE -ne 0) { throw "安装包 Authenticode 签名失败" }
          & $signtool.FullName verify /pa /v "dist\install.exe"
          if ($LASTEXITCODE -ne 0) { throw "安装包 Authenticode 验证失败" }
          foreach ($required in @("dist\install.exe", "dist\manifest.json", "dist\update.zip")) {
            if (-not (Test-Path $required)) { throw "缺少发布资产: $required" }
          }
          $checksumFiles = Get-ChildItem "dist\install.exe", "dist\manifest.json", "dist\update.zip"
          $checksumFiles += Get-ChildItem "dist\delta-*.zip" -ErrorAction SilentlyContinue
          $checksumLines = foreach ($file in $checksumFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath "dist\checksums.sha256" -Value $checksumLines -Encoding ascii
          if (-not (Test-Path "dist\checksums.sha256")) { throw "未生成 checksums.sha256" }
          Get-ChildItem dist -Name
        env:
          WENMO_SIGNING_PASSWORD: ${{ secrets.WENMO_SIGNING_PASSWORD }}
          WENMO_TIMESTAMP_URL: ${{ secrets.WENMO_TIMESTAMP_URL }}

      - name: Windows 安装与启动烟测
        id: install-smoke
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "WenmoInstallSmoke"
          $installer = (Resolve-Path "dist\install.exe").Path
          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "安装烟测失败，exit=$($install.ExitCode)" }
          $exe = Join-Path $installDir "问墨.exe"
          if (-not (Test-Path $exe)) { throw "安装后缺少主程序：$exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) { throw "安装后的主程序启动即退出，exit=$($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait
          }

      - name: 生成 GitHub/Sigstore 构建来源证明
        if: github.ref_type == 'tag' || inputs.publish == true
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/install.exe
            dist/manifest.json
            dist/update.zip
            dist/checksums.sha256

      - name: 清理临时代码签名证书
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "wenmo-signing.pfx") -Force -ErrorAction SilentlyContinue

      # ---------- 9. 发布 GitHub Release ----------
      # tag 触发：用 tag 名（v1.0.7）
      # 手动触发：用输入的版本号或从 updater.py 读
      - name: 发布 GitHub Release
        if: github.ref_type == 'tag' || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 问墨·code ${{ steps.version.outputs.tag }}
          body: |
            ## 问墨·code 自动构建发布
            - 构建方式：GitHub Actions CI 自动打包
            - 包含：PyInstaller 打包 + Inno Setup 安装包
            - 资产：install.exe（安装包）+ manifest.json（增量指纹）+ update.zip（全量更新）+ delta（增量更新）
          files: |
            dist/install.exe
            dist/manifest.json
            dist/update.zip
            dist/checksums.sha256
          fail_on_unmatched_files: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传可选增量包
        if: github.ref_type == 'tag' || inputs.publish == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $delta = Get-ChildItem dist\delta-*.zip -ErrorAction SilentlyContinue
          if ($delta) {
            gh release upload "${{ steps.version.outputs.tag }}" $delta.FullName --clobber
          } else {
            Write-Host "无上一版本清单，跳过增量包上传"
          }

      # ---------- 10. 上传构建日志（便于排查）----------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
          retention-days: 7
          if-no-files-found: ignore
